<g class="green"><rect x="40" y="372" width="395" height="52" rx="4"/><text class="th" x="237" y="394" text-anchor="middle">Shared invoker</text><text class="ts" x="237" y="412" text-anchor="middle">resolve · validate input · execute · validate result</text></g>
<g class="gray"><rect x="450" y="372" width="190" height="52" rx="4"/><text class="th" x="545" y="394" text-anchor="middle">Action handlers</text><text class="ts" x="545" y="412" text-anchor="middle">104 actions · port to operations</text></g>
