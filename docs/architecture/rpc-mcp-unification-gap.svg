<g class="red"><rect x="40" y="290" width="190" height="52" rx="4" stroke-dasharray="4 3"/><text class="th" x="135" y="312" text-anchor="middle">RPC pre-invocation</text><text class="ts" x="135" y="330" text-anchor="middle">not built</text></g>
<g class="red"><rect x="245" y="290" width="190" height="52" rx="4" stroke-dasharray="4 3"/><text class="th" x="340" y="312" text-anchor="middle">MCP pre-invocation</text><text class="ts" x="340" y="330" text-anchor="middle">not built</text></g>
<line class="arr" x1="135" y1="342" x2="135" y2="372" marker-end="url(#arrow)"/>
