<svg xmlns="http://www.w3.org/2000/svg" width="680" viewBox="0 0 680 760" role="img">
<title>RPC/MCP unification target versus what is built in dev</title>
<desc>Two caller paths, human RPC and agent MCP, descend through thin adapters into a shared invoker, a flat operation registry, task implementations and SQLite. Both pre-invocation policy stages are marked as not built, and per-operation admission is marked as the place policy lives today.</desc>
<style>
  .th { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .ts { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  rect { stroke-width: 0.5; }
  .arr { stroke: #78909C; stroke-width: 1.5; }
  .green rect { fill: #E6F4EA; stroke: #2E7D32; }
  .green .th { fill: #1B5E20; } .green .ts { fill: #2E7D32; }
  .red rect { fill: #FDECEA; stroke: #C62828; }
  .red .th { fill: #B71C1C; } .red .ts { fill: #C62828; }
  .amber rect { fill: #FFF3E0; stroke: #EF6C00; }
  .amber .th { fill: #E65100; } .amber .ts { fill: #EF6C00; }
  .gray rect { fill: #ECEFF1; stroke: #607D8B; }
  .gray .th { fill: #263238; } .gray .ts { fill: #455A64; }
  .key { fill: #455A64; }
  @media (prefers-color-scheme: dark) {
    .green rect { fill: #1B3D2A; stroke: #66BB6A; }
    .green .th { fill: #C8E6C9; } .green .ts { fill: #A5D6A7; }
    .red rect { fill: #4A1F1F; stroke: #EF5350; }
    .red .th { fill: #FFCDD2; } .red .ts { fill: #EF9A9A; }
    .amber rect { fill: #4A3212; stroke: #FFA726; }
    .amber .th { fill: #FFE0B2; } .amber .ts { fill: #FFCC80; }
    .gray rect { fill: #2C3237; stroke: #90A4AE; }
    .gray .th { fill: #CFD8DC; } .gray .ts { fill: #B0BEC5; }
    .key { fill: #B0BEC5; }
    .arr { stroke: #90A4AE; }
  }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#78909C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g class="gray"><rect x="60" y="56" width="260" height="40" rx="4"/><text class="th" x="190" y="81" text-anchor="middle">Web · desktop</text></g>
<g class="gray"><rect x="360" y="56" width="260" height="40" rx="4"/><text class="th" x="490" y="81" text-anchor="middle">Agent SDK · ACP</text></g>
<line class="arr" x1="190" y1="96" x2="190" y2="126" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="96" x2="490" y2="126" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="126" width="260" height="40" rx="4"/><text class="th" x="190" y="151" text-anchor="middle">MessageHub</text></g>
<g class="gray"><rect x="360" y="126" width="260" height="40" rx="4"/><text class="th" x="490" y="151" text-anchor="middle">MCP server</text></g>
<line class="arr" x1="190" y1="166" x2="190" y2="196" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="166" x2="490" y2="196" marker-end="url(#arrow)"/>

<g class="green"><rect x="60" y="196" width="260" height="52" rx="4"/><text class="th" x="190" y="218" text-anchor="middle">operation.invoke</text><text class="ts" x="190" y="236" text-anchor="middle">thin adapter · built</text></g>
<g class="green"><rect x="360" y="196" width="260" height="52" rx="4"/><text class="th" x="490" y="218" text-anchor="middle">hyperneo-operations</text><text class="ts" x="490" y="236" text-anchor="middle">thin adapter · built</text></g>
<line class="arr" x1="190" y1="248" x2="190" y2="278" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="248" x2="490" y2="278" marker-end="url(#arrow)"/>

<g class="red"><rect x="60" y="278" width="260" height="52" rx="4" stroke-dasharray="4 3"/><text class="th" x="190" y="300" text-anchor="middle">RPC pre-invocation</text><text class="ts" x="190" y="318" text-anchor="middle">not built · no scope check</text></g>
<g class="red"><rect x="360" y="278" width="260" height="52" rx="4" stroke-dasharray="4 3"/><text class="th" x="490" y="300" text-anchor="middle">MCP pre-invocation</text><text class="ts" x="490" y="318" text-anchor="middle">not built · no autonomy gate</text></g>
<line class="arr" x1="190" y1="330" x2="190" y2="360" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="330" x2="490" y2="360" marker-end="url(#arrow)"/>

<g class="green"><rect x="60" y="360" width="560" height="52" rx="4"/><text class="th" x="340" y="382" text-anchor="middle">Shared invoker</text><text class="ts" x="340" y="400" text-anchor="middle">resolve · validate input · execute · validate result</text></g>
<line class="arr" x1="340" y1="412" x2="340" y2="442" marker-end="url(#arrow)"/>

<g class="green"><rect x="60" y="442" width="560" height="52" rx="4"/><text class="th" x="340" y="464" text-anchor="middle">Flat operation registry</text><text class="ts" x="340" y="482" text-anchor="middle">space implementations override the same names</text></g>
<line class="arr" x1="340" y1="494" x2="340" y2="514" marker-end="url(#arrow)"/>

<g class="amber"><rect x="60" y="514" width="560" height="52" rx="4"/><text class="th" x="340" y="536" text-anchor="middle">Per-operation admission</text><text class="ts" x="340" y="554" text-anchor="middle">admitSpaceTaskCaller in 4 files · rpc skips the scope check</text></g>
<line class="arr" x1="190" y1="566" x2="190" y2="586" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="566" x2="490" y2="586" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="586" width="260" height="52" rx="4"/><text class="th" x="190" y="608" text-anchor="middle">Standalone tasks</text><text class="ts" x="190" y="626" text-anchor="middle">storage/tasks</text></g>
<g class="gray"><rect x="360" y="586" width="260" height="52" rx="4"/><text class="th" x="490" y="608" text-anchor="middle">Space overrides</text><text class="ts" x="490" y="626" text-anchor="middle">26 files · 3,012 lines</text></g>
<line class="arr" x1="190" y1="638" x2="190" y2="658" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="638" x2="490" y2="658" marker-end="url(#arrow)"/>

<g class="gray"><rect x="60" y="658" width="560" height="40" rx="4"/><text class="th" x="340" y="683" text-anchor="middle">SQLite · LiveQuery</text></g>

<g class="green"><rect x="60" y="722" width="12" height="12" rx="2"/></g>
<text class="ts key" x="80" y="732">built today</text>
<g class="red"><rect x="200" y="722" width="12" height="12" rx="2" stroke-dasharray="3 2"/></g>
<text class="ts key" x="220" y="732">target, not built</text>
<g class="amber"><rect x="370" y="722" width="12" height="12" rx="2"/></g>
<text class="ts key" x="390" y="732">policy that must move up</text>
</svg>
