<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">HyperNeo square social post template</title>
  <desc id="desc">Square dark social post template with the approved mark, one short insight, and a quiet signal pattern.</desc>
  <defs>
    <symbol id="hn-mark" viewBox="0 0 144 377"><path fill="currentColor" d="M5.5 0h44A5.5 5.5 0 0 1 55 5.5v366a5.5 5.5 0 0 1-5.5 5.5h-44A5.5 5.5 0 0 1 0 371.5V5.5A5.5 5.5 0 0 1 5.5 0Zm89 0h44a5.5 5.5 0 0 1 5.5 5.5V166a5.5 5.5 0 0 1-5.5 5.5h-44A5.5 5.5 0 0 1 89 166V5.5A5.5 5.5 0 0 1 94.5 0Zm0 205.5h44a5.5 5.5 0 0 1 5.5 5.5v160.5a5.5 5.5 0 0 1-5.5 5.5h-44a5.5 5.5 0 0 1-5.5-5.5V211a5.5 5.5 0 0 1 5.5-5.5Z"/></symbol>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#DCE5DD" stroke-opacity=".06"/></pattern>
    <style>.sans{font-family:Inter,"Noto Sans SC","Helvetica Neue",Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace;letter-spacing:1.8px}</style>
  </defs>
  <rect width="1200" height="1200" fill="#07110C"/><rect width="1200" height="1200" fill="url(#grid)"/>
  <circle cx="1080" cy="120" r="320" fill="#102019"/><circle cx="1080" cy="120" r="260" fill="none" stroke="#53E59A" stroke-opacity=".13" stroke-width="1"/>
  <g transform="translate(88 83) scale(.12)" color="#53E59A"><use href="#hn-mark" width="144" height="377"/></g>
  <text x="130" y="115" class="sans" font-size="27" font-weight="600" fill="#F2F4EF">HyperNeo</text>
  <text x="92" y="354" class="mono" font-size="15" fill="#9AF2C0">[INSIGHT  /  01]</text>
  <text x="92" y="475" class="sans" font-size="74" font-weight="540" letter-spacing="-2.5" fill="#F2F4EF">[Find the signal</text>
  <text x="92" y="566" class="sans" font-size="74" font-weight="540" letter-spacing="-2.5" fill="#53E59A">beneath the noise.]</text>
  <path d="M92 646H822" stroke="#2B4033"/><path d="M92 646H236" stroke="#53E59A" stroke-width="3"/>
  <text x="92" y="704" class="sans" font-size="24" fill="#A0B0A5">[One supporting thought. Keep it specific,</text>
  <text x="92" y="741" class="sans" font-size="24" fill="#A0B0A5">useful, and generous with context.]</text>
  <g transform="translate(925 427) scale(.72)" color="#53E59A"><use href="#hn-mark" width="144" height="377"/></g>
  <text x="92" y="1082" class="mono" font-size="11" fill="#829589">CALM ENOUGH TO SEE  ·  CLEAR ENOUGH TO ACT</text>
  <text x="1108" y="1082" class="mono" text-anchor="end" font-size="11" fill="#829589">[URL]</text>
</svg>
