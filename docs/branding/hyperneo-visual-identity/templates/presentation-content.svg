<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">HyperNeo presentation content slide template</title>
  <desc id="desc">Light 16 by 9 presentation slide with a headline, three evidence columns, and a bottom-line recommendation.</desc>
  <defs>
    <symbol id="hn-mark" viewBox="0 0 144 377"><path fill="currentColor" d="M5.5 0h44A5.5 5.5 0 0 1 55 5.5v366a5.5 5.5 0 0 1-5.5 5.5h-44A5.5 5.5 0 0 1 0 371.5V5.5A5.5 5.5 0 0 1 5.5 0Zm89 0h44a5.5 5.5 0 0 1 5.5 5.5V166a5.5 5.5 0 0 1-5.5 5.5h-44A5.5 5.5 0 0 1 89 166V5.5A5.5 5.5 0 0 1 94.5 0Zm0 205.5h44a5.5 5.5 0 0 1 5.5 5.5v160.5a5.5 5.5 0 0 1-5.5 5.5h-44a5.5 5.5 0 0 1-5.5-5.5V211a5.5 5.5 0 0 1 5.5-5.5Z"/></symbol>
    <style>.sans{font-family:Inter,"Noto Sans SC","Helvetica Neue",Arial,sans-serif}.mono{font-family:SFMono-Regular,Consolas,monospace;letter-spacing:1.6px}.body{font-size:22px;fill:#536359}</style>
  </defs>
  <rect width="1920" height="1080" fill="#F2F4EF"/>
  <g transform="translate(96 64) scale(.085)" color="#102019"><use href="#hn-mark" width="144" height="377"/></g>
  <text x="122" y="87" class="sans" font-size="21" font-weight="600" fill="#102019">HyperNeo</text>
  <text x="1824" y="85" class="mono" text-anchor="end" font-size="12" fill="#829589">[STRATEGY]  /  [DATE]</text>
  <path d="M96 122H1824" stroke="#C6D1C8"/>
  <text x="96" y="192" class="mono" font-size="13" fill="#829589">[SECTION  /  QUESTION]</text>
  <text x="96" y="270" class="sans" font-size="52" font-weight="550" letter-spacing="-1.8" fill="#102019">[One idea per slide. Make the point explicit.]</text>
  <text x="96" y="322" class="sans" font-size="22" fill="#536359">[Add the context needed to interpret the evidence, in one sentence.]</text>
  <g>
    <rect x="96" y="390" width="544" height="328" rx="16" fill="#FFFFFF" stroke="#DCE5DD"/>
    <text x="128" y="438" class="mono" font-size="12" fill="#829589">01  /  SIGNAL</text>
    <text x="128" y="512" class="sans" font-size="46" font-weight="550" fill="#102019">[Metric]</text>
    <text x="128" y="550" class="sans body">[What changed, compared with</text><text x="128" y="581" class="sans body">which baseline, and why it matters.]</text>
    <path d="M128 633H608" stroke="#DCE5DD"/><text x="128" y="672" class="sans" font-size="16" fill="#536359">Source: [source, date, and confidence]</text>
  </g>
  <g>
    <rect x="688" y="390" width="544" height="328" rx="16" fill="#FFFFFF" stroke="#DCE5DD"/>
    <text x="720" y="438" class="mono" font-size="12" fill="#829589">02  /  IMPLICATION</text>
    <text x="720" y="512" class="sans" font-size="32" font-weight="540" fill="#102019">[What it means]</text>
    <text x="720" y="564" class="sans body">[Connect the signal to a strategic</text><text x="720" y="595" class="sans body">choice. Separate evidence from</text><text x="720" y="626" class="sans body">interpretation and assumption.]</text>
    <path d="M720 660H1200" stroke="#DCE5DD"/><text x="720" y="690" class="sans" font-size="16" fill="#536359">Confidence: [high / medium / low]</text>
  </g>
  <g>
    <rect x="1280" y="390" width="544" height="328" rx="16" fill="#FFFFFF" stroke="#DCE5DD"/>
    <text x="1312" y="438" class="mono" font-size="12" fill="#829589">03  /  TRADE-OFF</text>
    <text x="1312" y="512" class="sans" font-size="32" font-weight="540" fill="#102019">[What we give up]</text>
    <text x="1312" y="564" class="sans body">[Name the cost and the condition</text><text x="1312" y="595" class="sans body">that would change the decision.]</text>
    <path d="M1312 633H1792" stroke="#DCE5DD"/><text x="1312" y="672" class="sans" font-size="16" fill="#536359">Watch: [risk or leading indicator]</text>
  </g>
  <rect x="96" y="772" width="1728" height="164" rx="16" fill="#102019"/>
  <text x="132" y="818" class="mono" font-size="12" fill="#9AF2C0">BOTTOM LINE</text>
  <text x="132" y="870" class="sans" font-size="30" font-weight="520" fill="#F2F4EF">[State the recommended move and who owns the next step.]</text>
  <text x="132" y="908" class="sans" font-size="17" fill="#A0B0A5">[Decision requested]  ·  [Owner]  ·  [Date]</text>
  <text x="96" y="1010" class="mono" font-size="11" fill="#829589">HYPERNEO  /  QUIET CLARITY FOR CONSEQUENTIAL WORK</text>
  <text x="1824" y="1010" class="mono" text-anchor="end" font-size="11" fill="#829589">[DECK NAME]  ·  [PAGE]</text>
</svg>
