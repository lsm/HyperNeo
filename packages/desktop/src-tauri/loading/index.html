<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperNeo - Loading</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            max-width: 560px;
            padding: 0 24px;
        }
        .logo {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            color: #888;
            font-size: 14px;
        }
        .error {
            display: none;
            margin-top: 8px;
            padding: 16px;
            border: 1px solid #5a2020;
            border-radius: 8px;
            background: #1a0d0d;
            text-align: left;
        }
        .error-title {
            color: #ff6b6b;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error-detail {
            color: #b8b8b8;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .error-hint {
            color: #888;
            font-size: 12px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">HyperNeo</div>
        <div class="spinner" id="spinner"></div>
        <div class="status" id="status">Starting AI assistant...</div>
        <div class="error" id="error">
            <div class="error-title">HyperNeo could not start</div>
            <div class="error-detail" id="error-detail"></div>
            <div class="error-hint">Quit HyperNeo from the tray menu and try again.</div>
        </div>
    </div>
    <script>
        window.__hyperneoShowStartupError = function (message) {
            var status = document.getElementById('status');
            var spinner = document.getElementById('spinner');
            var box = document.getElementById('error');
            var detail = document.getElementById('error-detail');
            if (detail) detail.textContent = message;
            if (spinner) spinner.style.display = 'none';
            if (status) status.style.display = 'none';
            if (box) box.style.display = 'block';
        };
    </script>
</body>
</html>
