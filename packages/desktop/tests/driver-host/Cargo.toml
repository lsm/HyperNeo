[package]
name = "desktop-driver-fixture"
version = "0.1.0"
edition = "2021"

[dependencies]
cua-driver-sdk = { git = "https://github.com/lsm/cua.git", tag = "hyperneo-cua-driver-v0.44.0-1" }
tokio = { version = "1", features = ["full", "test-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "=3.27.0"
libc = "=0.2.186"
core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
dispatch2 = "=0.3.1"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSImage", "NSImageView", "NSLayoutConstraint", "NSResponder", "NSStackView", "NSUserInterfaceLayout", "NSView", "NSWorkspace"] }
log = "0.4"
