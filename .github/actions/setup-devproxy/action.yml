name: 'Setup Dev Proxy'
description: 'Start the Bun mock server (dev-proxy-stub) on port 8000'
author: 'lsm'

runs:
  using: 'composite'
  steps:
    # ── Start the Bun mock server ─────────────────────────────────────────────
    # scripts/dev-proxy-stub.ts serves the .devproxy mocks with the same
    # matching semantics as dotnet/dev-proxy's MockResponsePlugin, so online
    # tests keep using ANTHROPIC_BASE_URL=http://127.0.0.1:8000 unchanged.
    # Requires Bun on PATH (the setup-bun step must run before this action).
    # It has no dependencies, so it works before `bun install`.
    - name: Start Dev Proxy
      shell: bash
      run: |
        set -euo pipefail

        bun scripts/dev-proxy-stub.ts \
          --port 8000 \
          --api-port 8897 \
          --config-file .devproxy/devproxyrc.json &
        STUB_PID=$!
        echo "DEVPROXY_PID=$STUB_PID" >> "$GITHUB_ENV"

        READY=false
        for i in $(seq 1 30); do
          if ! kill -0 "$STUB_PID" 2>/dev/null; then
            echo "::error::Dev Proxy stub exited during startup"
            exit 1
          fi
          if nc -z 127.0.0.1 8000 2>/dev/null; then
            echo "Dev Proxy stub is ready"
            READY=true
            break
          fi
          sleep 0.5
        done
        if [ "$READY" != "true" ]; then
          echo "::error::Dev Proxy stub did not become ready within 15 seconds"
          exit 1
        fi
