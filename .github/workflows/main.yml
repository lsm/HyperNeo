# CI - Build, test, and quality checks
#
# A full automatic run schedules 9 unit legs (shared + 8 balanced daemon),
# 11 online legs and 1 web leg, plus quality checks, path filtering and Deno
# boot smoke. The balance report follows the tests. This can exceed the
# account's 20 shared concurrent runners; jobs may queue, especially when PRs
# overlap, so a PR's new head cancels its old run and the path filter skips
# legs a PR cannot affect. Smaller unit buckets shorten the longest leg, not
# the queue.
# Coverage instrumentation is REMOVED from CI entirely (owner directive
# 2026-08-23):
# no per-job --coverage, no lcov artifacts, no coverage gate, baseline, or
# badge. Test jobs still upload junit XML (balance report + shard weights).
# Local coverage runs remain available via `./scripts/test-daemon.sh
# --coverage` — that flag is local-only and appears nowhere in CI.
#
# Test execution by trigger (path filters come from the `changes` job; unknown
# events default to running everything):
#
# | Trigger                               | Tests Run                                       |
# |---------------------------------------|-------------------------------------------------|
# | PR to dev (mixed code changes)        | check + 9 unit shards + 11 online shards + web  |
# | PR to dev (daemon-only, per changes)  | check + unit + online (web skipped)             |
# | PR to dev (prompts/daemon unit tests) | check + unit (online + web skipped)             |
# | PR to dev (web-only, per changes)     | check + web (unit + online skipped)             |
# | PR to dev (docs-only, per changes)    | check only                                      |
# | Push to dev                           | check + unit + online + web (no path filter)    |
# | Push of a v* tag                      | check + unit + online + web (no path filter)    |
# | workflow_dispatch                     | mocked CI + build                               |
#
# NOTE: Real-API daemon shards are manual-only in real-api-tests.yml.
#
# NOTE: The Deno boot smoke job runs on every trigger regardless of the
# daemon/web path filters (docs-only PRs included) — it guards the Bun/Deno
# dual-support migration and is non-blocking until flipped to required.
#
# NOTE: Sandbox apt packages (bubblewrap/socat/ripgrep) are intentionally not
# installed on test/build jobs — no CI-executed test there runs a real sandbox
# (online jobs set HYPERNEO_TEST_DISABLE_SANDBOX=1; tests/online/sandbox is
# matrix-exempt/manual-only; the build smoke test passes without them).
# real-api-tests.yml installs them for its real-session shards.
#
# Release is handled separately in release.yml (triggered by version tags).

name: CI

on:
  push:
    branches: [dev]
    tags: ['v*']
  pull_request:
    branches: [dev]
  workflow_dispatch:

# One group per ref. A PR's new head cancels the run for its old head, which
# frees the account's shared runners. Dev pushes, tags and manual runs are
# never cancelled mid-run: a newer push waits for the running one. Tag runs
# land in their own group (ci-refs/tags/<tag>-<event>), so a release's CI
# evidence run is never touched by dev pushes or a manual run on the tag.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref_type == 'tag' && format('-{0}', github.event_name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ============================================
  # CODE QUALITY CHECKS
  # Run on: PR to dev, push to dev
  # ============================================

  check:
    name: Lint, Knip, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      # Shallow checkout: nothing in this job walks history except the
      # space-task handler gate, which diffs HEAD against a fetched base tip
      # (tree diff — no merge-base walk), so depth 1 suffices.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Give the handler gate its comparison tip. On pull_request the checkout
      # only fetches refs/pull/N/merge; on workflow_dispatch it only fetches the
      # dispatched branch; on a tag push it only fetches the tag. Push-to-dev
      # needs no extra fetch (origin/dev == HEAD, so the gate diff is empty
      # and it no-ops); a tag at the dev tip no-ops the same way, and a tag
      # behind the tip diffs against the post-tag delta.
      - name: Fetch base branch for the space-task handler gate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
        run: git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate daemon shard configuration
        run: |
          bash scripts/lib/shard-split.sh --self-test
          ./scripts/test-daemon.sh --verify

      - name: Test pre-commit temporary file isolation
        run: bun run test:pre-commit

      - name: Test strip-comments argument handling
        run: bun run test:strip-comments

      - name: Test CI balance report parser
        run: bun run test:ci-balance-report

      - name: Test shard-weights generator
        run: bun run test:generate-shard-weights

      - name: Test flaky-test registry policy
        run: bun run test:flaky-test-runner

      - name: Test daemon DB rebuild script
        run: bun run test:rebuild-daemon-db

      - name: Test npm packaging script
        run: bun run test:package-npm

      # Folded in from the former test-cli job: ~2s of tests that used to occupy
      # a whole runner. Gated to the same events test-cli ran on (push to dev
      # or a release tag, workflow_dispatch) — skipped on PRs, exactly as
      # before; tag pushes run it so the release evidence run covers it.
      - name: Run CLI tests
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag') || github.event_name == 'workflow_dispatch'
        working-directory: packages/cli
        run: bunx vitest run

      # Single source of truth: run the same mega-target local devs run
      # (`make check` → `bun run check`). Fail-fast && chain; the
      # zero-comments gate runs first so nothing can mask it. This replaces
      # the former per-step lint/format/knip/typecheck/db-schema-parity
      # steps (which used continue-on-error + an aggregate step) and the
      # standalone check:no-comments / check:test-matrix /
      # check:online-shards steps, all now inside the
      # chain. strip-comments.ts enumerates files via `git ls-files`
      # (index-only), so the shallow checkout is fine.
      - name: Run make check
        run: make check

      - name: Verify exact version pins
        run: |
          if grep -rn '"[~^][0-9]' packages/*/package.json package.json; then
            echo "ERROR: Non-exact version pins found. Use exact versions only (no ^ or ~)."
            exit 1
          fi

  # ============================================
  # DENO BOOT SMOKE (dual-runtime support, task #1409)
  # Boots the daemon under pinned Deno 2.9.4 via scripts/deno-smoke.sh and
  # verifies HTTP 200 on /, the /ws WebSocket handshake, >80 sqlite tables
  # from migrations, and graceful SIGTERM teardown. This is the guardrail
  # that keeps later Bun/Deno dual-runtime PRs safe to land incrementally;
  # it runs on every trigger regardless of the daemon/web path filters.
  # REQUIRED since 2026-08-29 (green continuously since it landed 2026-08-24):
  # failures gate all-tests-pass, which is the one check the dev ruleset
  # requires — no ruleset change was needed for the flip.
  # Run on: PR to dev, push to dev, workflow_dispatch
  # ============================================

  deno-boot-smoke:
    name: Deno Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.4

      # Deno resolves workspace npm deps from the bun-installed node_modules
      # (BYONM), so this install is what lets the daemon boot with no network.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Deno boot smoke
        run: ./scripts/deno-smoke.sh

  # ============================================
  # PATH FILTERS
  # PR-only. Tree-diffs the PR merge commit against the dev tip and emits three
  # booleans (daemon unit, online, web) so daemon-only PRs skip web tests,
  # web-only PRs skip daemon unit+online, prompt or daemon-unit-test PRs skip
  # online, and docs-only PRs run check alone. Everything outside
  # packages/web (resp. the daemon-side packages) counts as daemon (resp.
  # web) work, so unknown/infra paths (scripts/, .github/, lockfiles) run
  # BOTH suites — the safe default. Push/workflow_dispatch events skip this
  # job and the test jobs treat a skipped filter as "run everything".
  # ============================================

  changes:
    name: Path Filter
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    outputs:
      daemon: ${{ steps.filter.outputs.daemon }}
      online: ${{ steps.filter.outputs.online }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute daemon/online/web path filters
        id: filter
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          # checkout@v6 on pull_request yields the merge commit, so a plain
          # two-dot tree-diff against the dev tip is exactly the PR's changed
          # file set (depth-1 fetches have no merge base for a three-dot
          # diff). --no-renames lists a rename as BOTH its old and new path
          # (delete + add), so a file moved across the daemon/web boundary
          # classifies both sides instead of only the destination. An
          # empty/unreadable diff falls back to running everything.
          files=$(git diff --name-only --no-renames origin/dev HEAD || true)
          if [ -z "$files" ]; then
            echo "Empty diff against dev — defaulting to run everything."
            echo "daemon=true" >> "$GITHUB_OUTPUT"
            echo "online=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          daemon=false
          online=false
          web=false
          while IFS= read -r f; do
            # Inert docs: docs/ trees and TOP-LEVEL *.md only. Bash case globs
            # match across '/', so a bare *.md would also swallow nested
            # functional assets (e.g. packages/skills/*/SKILL.md feeds the
            # bundled skill registry); those must fall through to the package
            # rules below.
            doc=false
            case "$f" in
              docs/*) doc=true ;;
              *.md) case "$f" in */*) ;; *) doc=true ;; esac ;;
            esac
            if [ "$doc" = true ]; then continue; fi
            # daemon unit shards unless the file is web-only
            case "$f" in
              packages/web/*) ;;
              *) daemon=true ;;
            esac
            # online shards unless the file is web-only, a prompt (unit tests
            # assert prompt text; no online test does) or a daemon unit test
            # (no online test imports tests/unit)
            case "$f" in
              packages/web/*|packages/prompts/*|packages/daemon/tests/unit/*) ;;
              *) online=true ;;
            esac
            # web unless the file is daemon-side-only (packages/ui and root
            # tooling count as web-relevant — they feed the web build; the web
            # never imports packages/prompts)
            case "$f" in
              packages/daemon/*|packages/cli/*|packages/skills/*|packages/desktop/*|packages/prompts/*) ;;
              *) web=true ;;
            esac
          done <<< "$files"
          echo "daemon=$daemon" >> "$GITHUB_OUTPUT"
          echo "online=$online" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # ============================================
  # DAEMON ONLINE TESTS (Mocked credentials only)
  # Run on: PR to dev (daemon paths), push to dev, workflow_dispatch
  # Real-key shards are manual-only in real-api-tests.yml.
  # 11 legs (task #1399 rebalance): rpc is split 4-way and space 2-way
  # (duration-weighted) by scripts/test-online.sh; every other directory is
  # duration-merged into combined modules (agent-sdk, convo-lifecycle,
  # features-misc, git-websocket, rewind). All modules run mocked through the
  # Dev Proxy.
  # ============================================

  test-daemon-online:
    name: Daemon Online (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.online == 'true') && (github.ref_type != 'tag' || github.event_name == 'push')
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - agent-sdk
          - convo-lifecycle
          - features-misc
          # Codex bridge tests disabled — requires OPENAI_API_KEY (real API, not mocked)
          # - providers-anthropic-to-codex-bridge
          # Copilot bridge tests disabled — COPILOT_GITHUB_TOKEN credential issue causing hard-fail
          # - providers-anthropic-copilot
          # GLM online tests disabled due to flakiness
          # - glm
          - git-websocket
          - rewind
          # rpc/ is split 4-way (duration-weighted) by scripts/test-online.sh (rpc-a…rpc-d).
          - rpc-a
          - rpc-b
          - rpc-c
          - rpc-d
          # space/ is split 2-way (duration-weighted) by scripts/test-online.sh (space-a…space-b).
          - space-a
          - space-b
        # NO module carries a hand-listed test_path: every module's files are
        # resolved at run time by scripts/test-online.sh (directory globs;
        # oversized directories split via scripts/lib/shard-split.sh), so a new
        # online test file auto-routes to a leg with no YAML edit. Rebalance a
        # split by editing its split count in scripts/test-online.sh. Run
        # `bash scripts/validate-test-matrix.sh` + `scripts/test-online.sh
        # --verify` to verify all files are covered.

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Dev Proxy
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-devproxy

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run daemon online tests (${{ matrix.module }})
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite daemon-online
          --results-dir test-results/daemon-online-${{ matrix.module }}
          --report test-results/flaky-quarantine-daemon-online-${{ matrix.module }}.json
          --
          bash -lc 'set -o pipefail; cd packages/daemon && paths=$(cd ../.. && scripts/test-online.sh ${{ matrix.module }}) && [ -n "$paths" ] || exit 1; node_modules/.bin/vitest run --config vitest.online.config.ts $paths
          --reporter=junit
          --outputFile.junit=../../test-results/daemon-online-${{ matrix.module }}/junit-${{ matrix.module }}.xml'
        env:
          # Every mocked-online module runs through the local Dev Proxy
          # (HYPERNEO_USE_DEV_PROXY) — no real API calls, no real secrets.
          HYPERNEO_USE_DEV_PROXY: '1'
          HYPERNEO_TEST_DISABLE_SANDBOX: '1'
          # Persist daemon structured/lifecycle logs into the results dir so a
          # failing shard's artifact carries the delivery lifecycle trace.
          HYPERNEO_LOG_FILE: ${{ github.workspace }}/test-results/daemon-online-${{ matrix.module }}/daemon.jsonl
          ANTHROPIC_BASE_URL: 'http://127.0.0.1:8000'
          # For Dev Proxy tests, never pass real Anthropic credentials.
          ANTHROPIC_API_KEY: 'sk-devproxy-test-key'
          ANTHROPIC_AUTH_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          COPILOT_GITHUB_TOKEN: ""
          GLM_API_KEY: ""
          MINIMAX_API_KEY: ""
          DEFAULT_PROVIDER: ""
          DEFAULT_MODEL: ""

      - name: Stop Dev Proxy
        if: always()
        run: |
          if [ -n "$DEVPROXY_PID" ]; then
            kill $DEVPROXY_PID 2>/dev/null || true
          fi

      - name: Upload junit + diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-online-junit-${{ matrix.module }}-${{ github.run_number }}
          path: test-results/daemon-online-${{ matrix.module }}/
          retention-days: 7

  # ============================================
  # DAEMON + SHARED UNIT TESTS
  # Run on: PR to dev (daemon paths), push to dev
  # Shared plus eight duration-balanced daemon buckets. Definitions and
  # generated timing weights live in scripts/test-daemon.sh; the matrix guard
  # verifies that every unit-test file belongs to exactly one bucket.
  # ============================================

  test-daemon-shared-unit:
    name: Daemon Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.daemon == 'true')
    timeout-minutes: 47
    strategy:
      fail-fast: false
      matrix:
        shard: [shared, daemon-a, daemon-b, daemon-c, daemon-d, daemon-e, daemon-f, daemon-g, daemon-h]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run daemon + shared unit tests (${{ matrix.shard }})
        timeout-minutes: 45
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite daemon-unit
          --results-dir test-results/daemon
          --report test-results/flaky-quarantine-daemon-${{ matrix.shard }}.json
          --
          ./scripts/test-daemon.sh ${{ matrix.shard }}
        env:
          GLM_API_KEY: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""

      - name: Upload junit (balance report data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-unit-junit-${{ matrix.shard }}
          path: test-results/daemon/junit-${{ matrix.shard }}.xml
          retention-days: 7

      - name: Upload daemon test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-unit-log-${{ matrix.shard }}
          path: test-results/daemon/output-${{ matrix.shard }}.log
          retention-days: 7

  # ============================================
  # WEB TESTS
  # Run on: PR to dev (web paths), push to dev, workflow_dispatch
  # One leg (task #1399): the whole suite is ~1min of tests, so a single
  # unsharded vitest run replaces the former 2-way --shard matrix.
  # ============================================

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') && (github.event_name == 'pull_request' && github.base_ref == 'dev' || github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref_type == 'tag') || github.event_name == 'workflow_dispatch')
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web tests
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite web
          --results-dir test-results/web
          --report test-results/flaky-quarantine-web.json
          --
          bash -lc 'cd packages/web && bunx vitest run
          --reporter dot
          --reporter junit
          --outputFile.junit=../../test-results/web/junit-web.xml'

      - name: Upload junit (balance report data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-junit
          path: test-results/web/junit-web.xml
          retention-days: 7

  # ============================================
  # TEST DURATION BALANCE REPORT
  # Downloads the junit XML every test job uploads and renders per-file
  # durations + per-shard totals into the run summary (see
  # scripts/ci-balance-report.ts). This is the measurement behind shard
  # rebalance decisions. Read-only reporting: intentionally NOT part of
  # all-tests-pass gating, and it only runs when at least one test family
  # actually ran (path-filtered PRs may skip whole families — the downloads
  # tolerate the missing artifacts).
  # Run on: PR to dev, push to dev, workflow_dispatch (whenever tests ran)
  # ============================================

  test-balance-report:
    name: Test Duration Balance Report
    runs-on: ubuntu-latest
    needs: [test-daemon-shared-unit, test-daemon-online, test-web]
    if: ${{ !cancelled() && (contains(fromJSON('["success", "failure"]'), needs.test-daemon-shared-unit.result) || contains(fromJSON('["success", "failure"]'), needs.test-daemon-online.result) || contains(fromJSON('["success", "failure"]'), needs.test-web.result)) }}
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Download daemon unit junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/unit
          pattern: daemon-unit-junit-*

      - name: Download daemon online junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/online
          pattern: daemon-online-junit-*

      - name: Download web junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/web
          pattern: web-junit*

      - name: Build balance report
        run: bun run scripts/ci-balance-report.ts balance --top 25

  # ============================================
  # BUILD - Compile linux-x64 binary + smoke test
  # Run on: push to dev, workflow_dispatch
  # Waits for test jobs; proceeds if they passed or were skipped.
  # ============================================

  build:
    name: Build Binary (linux-x64)
    runs-on: ubuntu-latest
    needs: [check, test-daemon-online, test-daemon-shared-unit, test-web]
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' ||
       github.event_name == 'workflow_dispatch') &&
      contains(fromJSON('["success", "skipped"]'), needs.check.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.test-daemon-online.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.test-daemon-shared-unit.result) &&
      contains(fromJSON('["success", "skipped"]'), needs.test-web.result)
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        run: cd packages/web && bun run build

      - name: Generate embedded assets
        run: bun run scripts/generate-embedded-assets.ts

      - name: Compile binary
        run: bun build --compile --root=packages --target=bun-linux-x64 --outfile=dist/bin/hyperneo-linux-x64 packages/cli/prod-entry.ts $(bun scripts/compiled-worker-entrypoints.ts)

      - name: Smoke test
        run: bun run scripts/smoke-test.ts ./dist/bin/hyperneo-linux-x64
        env:
          GLM_API_KEY: smoke-test

      - name: Compile daemon binary
        run: bun build --compile --root=packages --target=bun-linux-x64 --outfile=dist/bin/hyperneod-linux-x64 packages/cli/daemon-entry.ts $(bun scripts/compiled-worker-entrypoints.ts)

      - name: Smoke test daemon binary
        run: bun run scripts/smoke-test.ts ./dist/bin/hyperneod-linux-x64 --daemon
        env:
          GLM_API_KEY: smoke-test
          HYPERNEO_DATA_DIR: /tmp/hyperneod-smoke-data


  windows-compiled-smoke:
    name: Windows Compiled Worker Smoke
    runs-on: windows-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.online == 'true')
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run worker resolution and compiled fixture contracts
        working-directory: packages/daemon
        run: bun test --preload=./tests/unit/setup.ts ./tests/unit/lib/runtime-worker-url.test.ts
      - name: Build compiled Windows CLI
        run: bun scripts/build-binary.ts --target bun-windows-x64
        env:
          HYPERNEO_BUILD_COMMIT: ${{ github.sha }}
      - name: Run isolated compiled startup smoke
        shell: pwsh
        run: |
          $run = Join-Path $env:RUNNER_TEMP 'hyperneo-windows-smoke'
          New-Item -ItemType Directory -Force "$run\home" | Out-Null
          $env:HOME = "$run\home"
          $env:HYPERNEO_DATA_DIR = "$run\data"
          $env:NODE_ENV = 'test'
          bun .claude/skills/verify/compiled-worker-startup.ts dist/bin/hyperneo-windows-x64.exe $run
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-compiled-worker-evidence
          path: ${{ runner.temp }}/hyperneo-windows-smoke/evidence/

  # ============================================
  # GATE - All tests must pass (handles conditional job results)
  # Depends only on check + the test jobs (and the push/dispatch-only build,
  # which is skipped on PRs) — no serialized tail after
  # the last test. Path-filtered suites report "skipped" and pass. The
  # balance report intentionally lags outside this gate.
  # ============================================

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - check
      - changes
      - test-daemon-online
      - test-daemon-shared-unit
      - test-web
      - build
      - deno-boot-smoke
      - windows-compiled-smoke

    steps:
      - name: Check all jobs passed
        run: |
          FAILED=0

          # Check job: PR to dev, push to dev
          if [[ "${{ needs.check.result }}" == "failure" ]]; then
            echo "❌ check failed"
            FAILED=1
          fi

          # changes: PR only — a failed path filter means the daemon/web
          # booleans are unknown, so the suites were skipped unsafely.
          if [[ "${{ needs.changes.result }}" == "failure" ]]; then
            echo "❌ changes (path filter) failed"
            FAILED=1
          fi

          # test-daemon-online: PR to dev (online paths), push to dev
          if [[ "${{ needs.test-daemon-online.result }}" == "failure" ]]; then
            echo "❌ test-daemon-online failed"
            FAILED=1
          fi

          # test-daemon-shared-unit: PR to dev (daemon paths), push to dev
          if [[ "${{ needs.test-daemon-shared-unit.result }}" == "failure" ]]; then
            echo "❌ test-daemon-shared-unit failed"
            FAILED=1
          fi

          # test-web: PR to dev (web paths), push to dev
          if [[ "${{ needs.test-web.result }}" == "failure" ]]; then
            echo "❌ test-web failed"
            FAILED=1
          fi

          # build: push to dev, workflow_dispatch
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ build failed"
            FAILED=1
          fi

          # deno-boot-smoke: PR to dev, push to dev, workflow_dispatch
          if [[ "${{ needs.deno-boot-smoke.result }}" == "failure" ]]; then
            echo "❌ deno-boot-smoke failed"
            FAILED=1
          fi

          if [[ "${{ needs.windows-compiled-smoke.result }}" != "success" && "${{ needs.windows-compiled-smoke.result }}" != "skipped" ]]; then
            echo "Windows compiled worker smoke did not pass"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "One or more required jobs failed:"
            echo "  check: ${{ needs.check.result }}"
            echo "  changes: ${{ needs.changes.result }}"
            echo "  test-daemon-online: ${{ needs.test-daemon-online.result }}"
            echo "  test-daemon-shared-unit: ${{ needs.test-daemon-shared-unit.result }}"
            echo "  test-web: ${{ needs.test-web.result }}"
            echo "  build: ${{ needs.build.result }}"
            echo "  deno-boot-smoke: ${{ needs.deno-boot-smoke.result }}"
            exit 1
          fi
          echo "All tests passed!"
