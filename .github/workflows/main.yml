# CI - Build, test, and quality checks
#
# Free-tier shape (task #1399): one PR run occupies at most 20 parallel jobs
# (1 check + 1 path-filter + 7 unit legs + 11 online legs + 1 web leg — the
# balance report runs after the tests, inside the same budget) so a solo run
# never queues behind the repo's 20 shared concurrent runners. Coverage
# instrumentation is REMOVED from CI entirely (owner directive 2026-08-23):
# no per-job --coverage, no lcov artifacts, no coverage gate, baseline, or
# badge. Test jobs still upload junit XML (balance report + shard weights).
# Local coverage runs remain available via `./scripts/test-daemon.sh
# --coverage` — that flag is local-only and appears nowhere in CI.
#
# Test execution by trigger (path filters come from the `changes` job; unknown
# events default to running everything):
#
# | Trigger                               | Tests Run                                       |
# |---------------------------------------|-------------------------------------------------|
# | PR to dev (mixed code changes)        | check + 7 unit shards + 11 online shards + web  |
# | PR to dev (daemon-only, per changes)  | check + unit + online (web skipped)             |
# | PR to dev (web-only, per changes)     | check + web (unit + online skipped)             |
# | PR to dev (docs-only, per changes)    | check only                                      |
# | Push to dev                           | check + unit + online + web (no path filter)    |
# | workflow_dispatch (default)           | mocked CI + no-LLM E2E                          |
# | workflow_dispatch (run_e2e_only=true) | discover + build + no-LLM E2E only              |
#
# NOTE: E2E tests are NOT run on any automatic trigger (push / PR). No-LLM E2E
# remains manual-only here via workflow_dispatch on any branch. Real-API daemon
# shards and LLM E2E are manual-only in real-api-tests.yml.
#
# NOTE: Sandbox apt packages (bubblewrap/socat/ripgrep) are intentionally not
# installed on test/build jobs — no CI-executed test there runs a real sandbox
# (online jobs set HYPERNEO_TEST_DISABLE_SANDBOX=1; tests/online/sandbox is
# matrix-exempt/manual-only; the build smoke test passes without them). e2e-no-llm
# is the exception: the compiled binary runs with the daemon-default sandbox
# enabled, so its SDK subprocess needs bwrap/socat at spawn. real-api-tests.yml
# installs them for its real-session shards too.
#
# Release is handled separately in release.yml (triggered by version tags).

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:
    inputs:
      run_e2e_only:
        description: 'Skip all prerequisite jobs and run only E2E tests (any branch)'
        required: false
        default: 'false'
        type: boolean

# Cancel in-progress runs when a new run is triggered on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================
  # CODE QUALITY CHECKS
  # Run on: PR to dev, push to dev
  # ============================================

  check:
    name: Lint, Knip, Format & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.inputs.run_e2e_only != 'true'

    steps:
      # Shallow checkout: nothing in this job walks history except the
      # space-task handler gate, which diffs HEAD against a fetched base tip
      # (tree diff — no merge-base walk), so depth 1 suffices.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Give the handler gate its comparison tip. On pull_request the checkout
      # only fetches refs/pull/N/merge; on workflow_dispatch it only fetches the
      # dispatched branch. Push-to-dev needs no extra fetch (origin/dev == HEAD,
      # so the gate diff is empty and it no-ops).
      - name: Fetch base branch for the space-task handler gate
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate daemon shard configuration
        run: |
          bash scripts/lib/shard-split.sh --self-test
          ./scripts/test-daemon.sh --verify

      - name: Test space task RPC handler gate
        run: bun run test:space-task-handler-gate

      - name: Test strip-comments argument handling
        run: bun run test:strip-comments

      - name: Test CI balance report parser
        run: bun run test:ci-balance-report

      - name: Test shard-weights generator
        run: bun run test:generate-shard-weights

      # Folded in from the former test-cli job: ~2s of tests that used to occupy
      # a whole runner. Gated to the same events test-cli ran on (push to dev,
      # workflow_dispatch) — skipped on PRs, exactly as before.
      - name: Run CLI tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch'
        working-directory: packages/cli
        run: bunx vitest run

      # Single source of truth: run the same mega-target local devs run
      # (`make check` → `bun run check`). Fail-fast && chain; the
      # zero-comments gate runs first so nothing can mask it. This replaces
      # the former per-step lint/format/knip/typecheck/db-schema-parity
      # steps (which used continue-on-error + an aggregate step) and the
      # standalone check:no-comments / check:space-task-handler-tests /
      # check:test-matrix / check:online-shards steps, all now inside the
      # chain. strip-comments.ts enumerates files via `git ls-files`
      # (index-only), so the shallow checkout is fine.
      - name: Run make check
        run: make check

      - name: Verify exact version pins
        run: |
          if grep -rn '"[~^][0-9]' packages/*/package.json package.json; then
            echo "ERROR: Non-exact version pins found. Use exact versions only (no ^ or ~)."
            exit 1
          fi

  # ============================================
  # PATH FILTERS
  # PR-only. Tree-diffs the PR merge commit against the dev tip and emits two
  # booleans so daemon-only PRs skip web tests, web-only PRs skip daemon
  # unit+online, and docs-only PRs run check alone. Everything outside
  # packages/web (resp. the daemon-side packages) counts as daemon (resp.
  # web) work, so unknown/infra paths (scripts/, .github/, lockfiles) run
  # BOTH suites — the safe default. Push/workflow_dispatch events skip this
  # job and the test jobs treat a skipped filter as "run everything".
  # ============================================

  changes:
    name: Path Filter
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: github.event_name == 'pull_request'
    outputs:
      daemon: ${{ steps.filter.outputs.daemon }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compute daemon/web path filters
        id: filter
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/dev:refs/remotes/origin/dev
          # checkout@v6 on pull_request yields the merge commit, so a plain
          # two-dot tree-diff against the dev tip is exactly the PR's changed
          # file set (depth-1 fetches have no merge base for a three-dot
          # diff). An empty/unreadable diff falls back to running everything.
          files=$(git diff --name-only origin/dev HEAD || true)
          if [ -z "$files" ]; then
            echo "Empty diff against dev — defaulting to run everything."
            echo "daemon=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          daemon=false
          web=false
          while IFS= read -r f; do
            # daemon unless the file is web-only or inert docs
            case "$f" in
              packages/web/*) ;;
              *.md|docs/*) ;;
              *) daemon=true ;;
            esac
            # web unless the file is daemon-side-only or inert docs (packages/ui
            # and root tooling count as web-relevant — they feed the web build)
            case "$f" in
              packages/daemon/*|packages/cli/*|packages/skills/*|packages/desktop/*|packages/e2e/*) ;;
              *.md|docs/*) ;;
              *) web=true ;;
            esac
          done <<< "$files"
          echo "daemon=$daemon" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

  # ============================================
  # DAEMON ONLINE TESTS (Mocked credentials only)
  # Run on: PR to dev (daemon paths), push to dev, workflow_dispatch
  # Real-key shards are manual-only in real-api-tests.yml.
  # 11 legs (task #1399): rpc is split 3-way and space 2-way
  # (duration-weighted) by scripts/test-online.sh; every other directory is a
  # single merged module (convo-agent, features, lifecycle-git-websocket,
  # rewind, sdk-misc). All modules run mocked through the Dev Proxy.
  # ============================================

  test-daemon-online:
    name: Daemon Online (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.daemon == 'true') && github.ref_type != 'tag' && github.event.inputs.run_e2e_only != 'true'
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        module:
          - convo-agent
          - features
          - lifecycle-git-websocket
          # Codex bridge tests disabled — requires OPENAI_API_KEY (real API, not mocked)
          # - providers-anthropic-to-codex-bridge
          # Copilot bridge tests disabled — COPILOT_GITHUB_TOKEN credential issue causing hard-fail
          # - providers-anthropic-copilot
          # GLM online tests disabled due to flakiness
          # - glm
          - rewind
          # rpc/ is split 3-way (duration-weighted) by scripts/test-online.sh (rpc-a…rpc-c).
          - rpc-a
          - rpc-b
          - rpc-c
          - sdk-misc
          # space/ is split 2-way (duration-weighted) by scripts/test-online.sh (space-a…space-b).
          - space-a
          - space-b
        # NO module carries a hand-listed test_path: every module's files are
        # resolved at run time by scripts/test-online.sh (directory globs;
        # oversized directories split via scripts/lib/shard-split.sh), so a new
        # online test file auto-routes to a leg with no YAML edit. Rebalance a
        # split by editing its split count in scripts/test-online.sh. Run
        # `bash scripts/validate-test-matrix.sh` + `scripts/test-online.sh
        # --verify` to verify all files are covered.

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup Dev Proxy
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-devproxy

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run daemon online tests (${{ matrix.module }})
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite daemon-online
          --results-dir test-results/daemon-online-${{ matrix.module }}
          --report test-results/flaky-quarantine-daemon-online-${{ matrix.module }}.json
          --
          bash -lc 'set -o pipefail; cd packages/daemon && paths=$(cd ../.. && scripts/test-online.sh ${{ matrix.module }}) && [ -n "$paths" ] || exit 1; node_modules/.bin/vitest run --config vitest.online.config.ts $paths
          --reporter=junit
          --outputFile.junit=../../test-results/daemon-online-${{ matrix.module }}/junit-${{ matrix.module }}.xml'
        env:
          # Every mocked-online module runs through the local Dev Proxy
          # (HYPERNEO_USE_DEV_PROXY) — no real API calls, no real secrets.
          HYPERNEO_USE_DEV_PROXY: '1'
          HYPERNEO_TEST_DISABLE_SANDBOX: '1'
          # Persist daemon structured/lifecycle logs into the results dir so a
          # failing shard's artifact carries the delivery lifecycle trace.
          HYPERNEO_LOG_FILE: ${{ github.workspace }}/test-results/daemon-online-${{ matrix.module }}/daemon.jsonl
          ANTHROPIC_BASE_URL: 'http://127.0.0.1:8000'
          # For Dev Proxy tests, never pass real Anthropic credentials.
          ANTHROPIC_API_KEY: 'sk-devproxy-test-key'
          ANTHROPIC_AUTH_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
          OPENAI_API_KEY: ""
          COPILOT_GITHUB_TOKEN: ""
          GLM_API_KEY: ""
          MINIMAX_API_KEY: ""
          DEFAULT_PROVIDER: ""
          DEFAULT_MODEL: ""

      - name: Stop Dev Proxy
        if: always()
        run: |
          if [ -n "$DEVPROXY_PID" ]; then
            kill $DEVPROXY_PID 2>/dev/null || true
          fi

      - name: Upload junit + diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-online-junit-${{ matrix.module }}-${{ github.run_number }}
          path: test-results/daemon-online-${{ matrix.module }}/
          retention-days: 7

  # ============================================
  # DAEMON + SHARED UNIT TESTS
  # Run on: PR to dev (daemon paths), push to dev
  # 7 legs (task #1399): shared · 1-core-a/b (duration-weighted 2-way) ·
  # handlers-migrations · storage-migrations · 5-space-a/b (duration-weighted
  # 2-way over the whole 5-space tree). Shard definitions live in
  # scripts/test-daemon.sh (source of truth); validate-test-matrix.sh guards
  # that every unit test file is owned by exactly one shard.
  # ============================================

  test-daemon-shared-unit:
    name: Daemon Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.daemon == 'true') && github.event.inputs.run_e2e_only != 'true'
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [shared, 1-core-a, 1-core-b, handlers-migrations, storage-migrations, 5-space-a, 5-space-b]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run daemon + shared unit tests (${{ matrix.shard }})
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite daemon-unit
          --results-dir test-results/daemon
          --report test-results/flaky-quarantine-daemon-${{ matrix.shard }}.json
          --
          ./scripts/test-daemon.sh ${{ matrix.shard }}
        env:
          GLM_API_KEY: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""

      - name: Upload junit (balance report data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daemon-unit-junit-${{ matrix.shard }}
          path: test-results/daemon/junit-${{ matrix.shard }}.xml
          retention-days: 7

  # ============================================
  # WEB TESTS
  # Run on: PR to dev (web paths), push to dev, workflow_dispatch
  # One leg (task #1399): the whole suite is ~1min of tests, so a single
  # unsharded vitest run replaces the former 2-way --shard matrix.
  # ============================================

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: always() && needs.changes.result != 'failure' && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') && (github.event_name == 'pull_request' && github.base_ref == 'dev' || github.event_name == 'push' && github.ref == 'refs/heads/dev' || github.event_name == 'workflow_dispatch') && github.event.inputs.run_e2e_only != 'true'
    timeout-minutes: 9

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run web tests
        run: >-
          bun run scripts/flaky-test-runner.ts
          --suite web
          --results-dir test-results/web
          --report test-results/flaky-quarantine-web.json
          --
          bash -lc 'cd packages/web && bunx vitest run
          --reporter dot
          --reporter junit
          --outputFile.junit=../../test-results/web/junit-web.xml'

      - name: Upload junit (balance report data)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-junit
          path: test-results/web/junit-web.xml
          retention-days: 7

  # ============================================
  # TEST DURATION BALANCE REPORT
  # Downloads the junit XML every test job uploads and renders per-file
  # durations + per-shard totals into the run summary (see
  # scripts/ci-balance-report.ts). This is the measurement behind shard
  # rebalance decisions. Read-only reporting: intentionally NOT part of
  # all-tests-pass gating, and it only runs when at least one test family
  # actually ran (path-filtered PRs may skip whole families — the downloads
  # tolerate the missing artifacts).
  # Run on: PR to dev, push to dev, workflow_dispatch (whenever tests ran)
  # ============================================

  test-balance-report:
    name: Test Duration Balance Report
    runs-on: ubuntu-latest
    needs: [test-daemon-shared-unit, test-daemon-online, test-web]
    if: ${{ !cancelled() && github.event.inputs.run_e2e_only != 'true' && (contains(fromJSON('["success", "failure"]'), needs.test-daemon-shared-unit.result) || contains(fromJSON('["success", "failure"]'), needs.test-daemon-online.result) || contains(fromJSON('["success", "failure"]'), needs.test-web.result)) }}
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Download daemon unit junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/unit
          pattern: daemon-unit-junit-*

      - name: Download daemon online junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/online
          pattern: daemon-online-junit-*

      - name: Download web junit
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: balance/web
          pattern: web-junit*

      - name: Build balance report
        run: bun run scripts/ci-balance-report.ts balance --top 25

  # ============================================
  # BUILD - Compile linux-x64 binary + smoke test
  # Run on: push to dev, workflow_dispatch
  # Waits for test jobs; proceeds if they passed or were skipped.
  # Discover may be skipped (E2E is workflow_dispatch-only); we tolerate that.
  # ============================================

  build:
    name: Build Binary (linux-x64)
    runs-on: ubuntu-latest
    needs: [check, test-daemon-online, test-daemon-shared-unit, test-web, discover]
    if: >-
      always() &&
      (github.event_name == 'push' && github.ref == 'refs/heads/dev' ||
       github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.run_e2e_only == 'true' ||
       (contains(fromJSON('["success", "skipped"]'), needs.discover.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.check.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.test-daemon-online.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.test-daemon-shared-unit.result) &&
        contains(fromJSON('["success", "skipped"]'), needs.test-web.result)))
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend
        run: cd packages/web && bun run build

      - name: Generate embedded assets
        run: bun run scripts/generate-embedded-assets.ts

      - name: Compile binary
        run: bun build --compile --target=bun-linux-x64 --outfile=dist/bin/hyperneo-linux-x64 packages/cli/prod-entry.ts

      - name: Smoke test
        run: bun run scripts/smoke-test.ts ./dist/bin/hyperneo-linux-x64
        env:
          GLM_API_KEY: smoke-test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: hyperneo-linux-x64-e2e
          path: dist/bin/hyperneo-linux-x64

  # ============================================
  # DISCOVER TESTS
  # Auto-discover No-LLM E2E test files
  # LLM tests are excluded here and run from real-api-tests.yml.
  # Run on: workflow_dispatch only (No-LLM E2E is manual-only)
  # ============================================

  discover:
    name: Discover Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    outputs:
      tests_no_llm: ${{ steps.categorize.outputs.tests_no_llm }}
    steps:
      - uses: actions/checkout@v6

      - name: Categorize E2E test files
        id: categorize
        run: |
          # Tests that require LLM API round-trips are excluded here and run in real-api-tests.yml.
          LLM_TESTS=(core/message-flow core/interrupt-button core/interrupt-error-bug core/context-features core/model-selection features/archive features/file-operations features/message-operations features/provider-model-switching features/reviewer-feedback-loop features/rewind-features features/session-operations features/slash-cmd features/space-approval-gate-rejection features/space-artifacts-panel features/space-canvas-mode features/space-happy-path-pipeline features/worktree-isolation responsive/mobile responsive/tablet settings/auto-title)

          # Tests to exclude entirely (disabled, pending stabilization)
          EXCLUDED_TESTS=(
            features/space-export-import
            features/space-workflow-rules
          )

          # Build lookup sets
          declare -A LLM_SET EXCLUDED_SET
          for t in "${LLM_TESTS[@]}"; do LLM_SET[$t]=1; done
          for t in "${EXCLUDED_TESTS[@]}"; do EXCLUDED_SET[$t]=1; done

          # Find all test files recursively and extract subdir/name paths
          NO_LLM_JSON="[]"
          for file in $(find packages/e2e/tests -name "*.e2e.ts" -type f | sed 's|packages/e2e/tests/||; s|\.e2e\.ts$||' | sort); do
            if [[ -n "${EXCLUDED_SET[$file]}" ]]; then
              echo "EXCLUDED: $file"
              continue
            fi
            if [[ -n "${LLM_SET[$file]}" ]]; then
              echo "LLM (real-api-tests.yml): $file"
              continue
            fi
            # Create JSON object with path (for test runner) and name (for artifact/display)
            safe_name=$(echo "$file" | tr '/' '-')
            entry=$(jq -n -c --arg path "$file" --arg name "$safe_name" '{path: $path, name: $name}')
            NO_LLM_JSON=$(echo "$NO_LLM_JSON" | jq -c ". + [$entry]")
          done

          no_llm_count=$(echo "$NO_LLM_JSON" | jq length)
          echo "No-LLM tests ($no_llm_count): $NO_LLM_JSON"

          echo "tests_no_llm=$NO_LLM_JSON" >> $GITHUB_OUTPUT

  # ============================================
  # E2E TESTS - No LLM (Matrix, fully parallel)
  # UI-only tests that don't require LLM API calls
  # Run on: workflow_dispatch only (E2E is manual-only on any branch)
  # ============================================

  e2e-no-llm:
    name: E2E No-LLM (${{ matrix.test.name }})
    runs-on: ubuntu-latest
    needs: [build, discover]
    # Manual-only: E2E must be explicitly triggered via workflow_dispatch.
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      needs.build.result == 'success' &&
      needs.discover.result == 'success'
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test: ${{ fromJson(needs.discover.outputs.tests_no_llm) }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Required here: the compiled binary runs with the daemon-default sandbox
      # enabled, and the SDK subprocess hard-fails at spawn ("Sandbox required
      # but unavailable: bubblewrap (bwrap) not installed, socat not installed")
      # without these — breaking every no-LLM E2E test. Other jobs omit them.
      - name: Install sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d/ \( -name "*microsoft*" -o -name "*azure*" \) -delete 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: bun-deps-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-deps-${{ runner.os }}-

      - name: Install dependencies
        run: |
          echo "Starting bun install at $(date)"
          timeout 180 bun install --frozen-lockfile --verbose 2>&1 || {
            echo "bun install timed out or failed (lockfile may be stale — run 'bun install' locally and commit the updated bun.lock)"
            exit 1
          }
          echo "Finished bun install at $(date)"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('packages/e2e/package.json') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-

      - name: Install Playwright browsers
        run: cd packages/e2e && bunx playwright install chromium

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: hyperneo-linux-x64-e2e
          path: dist/bin/

      - name: Run E2E test (${{ matrix.test.name }})
        run: |
          chmod +x dist/bin/hyperneo-linux-x64
          WORKSPACE=$(mktemp -d)

          # Get a free port via a short-lived Python socket with SO_REUSEADDR.
          # SO_REUSEADDR shrinks the reuse window on Linux so the binary can
          # re-bind quickly even if the port is briefly in TIME_WAIT state.
          PORT=$(python3 -c 'import socket; s=socket.socket(socket.AF_INET, socket.SOCK_STREAM); s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1); s.bind(("",0)); print(s.getsockname()[1])')
          echo "Reserved port $PORT for binary"

          HYPERNEO_WORKSPACE_ROOT="$WORKSPACE" ./dist/bin/hyperneo-linux-x64 --port "$PORT" &
          BINARY_PID=$!
          trap 'kill $BINARY_PID 2>/dev/null; rm -rf "$WORKSPACE"' EXIT

          for i in $(seq 1 60); do
            if curl -s "http://localhost:$PORT/" > /dev/null 2>&1; then
              echo "Server ready on port $PORT (PID $BINARY_PID)"
              break
            fi
            if ! kill -0 $BINARY_PID 2>/dev/null; then
              echo "Binary process died unexpectedly"
              exit 1
            fi
            sleep 0.5
          done

          if ! curl -s "http://localhost:$PORT/" > /dev/null 2>&1; then
            echo "Server failed to start within 30s"
            exit 1
          fi

          export PLAYWRIGHT_BASE_URL="http://localhost:$PORT"
          cd packages/e2e
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            bunx playwright test "tests/${{ matrix.test.path }}.e2e.ts"
        env:
          # Set a dummy API key so provider availability check passes.
          # No-LLM tests don't need real API calls; the key just satisfies isAvailable().
          ANTHROPIC_API_KEY: "sk-devproxy-test-key"
          # Clear real auth tokens to avoid credential conflicts.
          ANTHROPIC_AUTH_TOKEN: ""
          CLAUDE_CODE_OAUTH_TOKEN: ""
          GLM_API_KEY: ""
          DEFAULT_MODEL: sonnet
          # Signal that the LLM will not respond in this environment.
          # rather than timing out waiting for a response from a dummy API key.
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-no-llm-results-${{ matrix.test.name }}
          path: |
            packages/e2e/test-results/
            packages/e2e/playwright-report/
          retention-days: 7

  # ============================================
  # GATE - All tests must pass (handles conditional job results)
  # Depends only on check + the test jobs (and the PR/dispatch-only build/
  # discover/e2e chain, which is skipped on PRs) — no serialized tail after
  # the last test. Path-filtered suites report "skipped" and pass. The
  # balance report intentionally lags outside this gate.
  # ============================================

  all-tests-pass:
    name: All Tests Pass
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - check
      - changes
      - test-daemon-online
      - test-daemon-shared-unit
      - test-web
      - build
      - discover
      - e2e-no-llm

    steps:
      - name: Check all jobs passed
        run: |
          FAILED=0

          # Check job: PR to dev, push to dev
          if [[ "${{ needs.check.result }}" == "failure" ]]; then
            echo "❌ check failed"
            FAILED=1
          fi

          # changes: PR only — a failed path filter means the daemon/web
          # booleans are unknown, so the suites were skipped unsafely.
          if [[ "${{ needs.changes.result }}" == "failure" ]]; then
            echo "❌ changes (path filter) failed"
            FAILED=1
          fi

          # test-daemon-online: PR to dev (daemon paths), push to dev
          if [[ "${{ needs.test-daemon-online.result }}" == "failure" ]]; then
            echo "❌ test-daemon-online failed"
            FAILED=1
          fi

          # test-daemon-shared-unit: PR to dev (daemon paths), push to dev
          if [[ "${{ needs.test-daemon-shared-unit.result }}" == "failure" ]]; then
            echo "❌ test-daemon-shared-unit failed"
            FAILED=1
          fi

          # test-web: PR to dev (web paths), push to dev
          if [[ "${{ needs.test-web.result }}" == "failure" ]]; then
            echo "❌ test-web failed"
            FAILED=1
          fi

          # build: push to dev, workflow_dispatch
          if [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "❌ build failed"
            FAILED=1
          fi

          # discover: workflow_dispatch only (E2E is manual-only)
          if [[ "${{ needs.discover.result }}" == "failure" ]]; then
            echo "❌ discover failed"
            FAILED=1
          fi

          # e2e-no-llm: workflow_dispatch only (E2E is manual-only)
          if [[ "${{ needs.e2e-no-llm.result }}" == "failure" ]]; then
            echo "❌ e2e-no-llm failed"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "One or more required jobs failed:"
            echo "  check: ${{ needs.check.result }}"
            echo "  changes: ${{ needs.changes.result }}"
            echo "  test-daemon-online: ${{ needs.test-daemon-online.result }}"
            echo "  test-daemon-shared-unit: ${{ needs.test-daemon-shared-unit.result }}"
            echo "  test-web: ${{ needs.test-web.result }}"
            echo "  build: ${{ needs.build.result }}"
            echo "  discover: ${{ needs.discover.result }}"
            echo "  e2e-no-llm: ${{ needs.e2e-no-llm.result }}"
            exit 1
          fi
          echo "All tests passed!"
