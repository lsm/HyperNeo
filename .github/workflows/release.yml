# Release - Build, publish to npm, and create GitHub Release
#
# Triggered by version tags (v*). Waits for CI to pass on the tagged
# commit before building platform binaries and publishing to npm.
#
# Flow:
# 1. Wait for CI workflow to pass on this commit (handles race conditions)
# 2. Build binaries for all platforms (4 targets)
# 3. Package into platform-specific npm packages
# 4. Publish to npm registry (Trusted Publishing via OIDC)
# 5. Create GitHub Release with auto-generated notes

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # ============================================
  # WAIT FOR CI
  # Ensure the tagged commit has passed all CI checks.
  # If CI is still running, wait for it to complete.
  # ============================================

  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"

      - name: Verify package versions match tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking package versions match tag version: $VERSION"
          MISMATCHES=()
          for pkg in npm/hyperneo packages/cli packages/daemon packages/e2e packages/shared packages/web packages/desktop; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              MISMATCHES+=("$pkg/package.json: $PKG_VERSION (expected $VERSION)")
            fi
          done
          TAURI_VERSION=$(node -p "require('./packages/desktop/src-tauri/tauri.conf.json').version")
          if [ "$TAURI_VERSION" != "$VERSION" ]; then
            MISMATCHES+=("packages/desktop/src-tauri/tauri.conf.json: $TAURI_VERSION (expected $VERSION)")
          fi
          DESKTOP_CARGO_VERSION=$(awk -F'"' '/^version = / { print $2; exit }' packages/desktop/src-tauri/Cargo.toml)
          if [ "$DESKTOP_CARGO_VERSION" != "$VERSION" ]; then
            MISMATCHES+=("packages/desktop/src-tauri/Cargo.toml: $DESKTOP_CARGO_VERSION (expected $VERSION)")
          fi
          if [ ${#MISMATCHES[@]} -gt 0 ]; then
            echo "ERROR: Version mismatches found!"
            printf '  %s\n' "${MISMATCHES[@]}"
            echo ""
            echo "All package and desktop bundle versions must match the release tag (v$VERSION)."
            echo "Bump all package and desktop bundle versions to $VERSION before tagging."
            exit 1
          fi
          echo "All package and desktop bundle versions match v$VERSION"

      - name: Verify commit is on dev branch
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/dev'; then
            echo "ERROR: Tagged commit $GITHUB_SHA is not on the dev branch"
            echo "Releases must be tagged on commits that exist on dev"
            exit 1
          fi
          echo "Commit $GITHUB_SHA is on dev branch"

      - name: Wait for CI to pass
        run: |
          echo "Waiting for CI workflow to pass on commit $GITHUB_SHA..."

          # Wait for the CI run to appear (may not have started yet if tag
          # was pushed at the same time as the commit)
          for attempt in $(seq 1 30); do
            RUN_ID=$(gh run list \
              --workflow=main.yml \
              --commit="$GITHUB_SHA" \
              --json databaseId \
              --jq '.[0].databaseId // empty')

            if [ -n "$RUN_ID" ]; then
              echo "Found CI run: $RUN_ID"
              break
            fi

            echo "No CI run found yet, waiting... (attempt $attempt/30)"
            sleep 10
          done

          if [ -z "$RUN_ID" ]; then
            echo "ERROR: No CI workflow run found for commit $GITHUB_SHA"
            echo "Ensure this commit was pushed to dev before tagging"
            exit 1
          fi

          # Wait for the run to complete (exits 0 on success, non-zero on failure)
          echo "Watching CI run $RUN_ID..."
          gh run watch "$RUN_ID" --exit-status || {
            echo "ERROR: CI workflow failed. Cannot release."
            exit 1
          }

          echo "CI passed! Proceeding with release."
        env:
          GH_TOKEN: ${{ github.token }}

  # ============================================
  # RELEASE BUILD
  # Build binaries for all platforms
  # ============================================

  release-build:
    name: Release Build ${{ matrix.binary }}
    runs-on: ${{ matrix.runner }}
    needs: wait-for-ci
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: bun-darwin-arm64
            binary: hyperneo-darwin-arm64
            smoke: true
          - runner: macos-15-intel
            target: bun-darwin-x64
            binary: hyperneo-darwin-x64
            smoke: true
          - runner: ubuntu-latest
            target: bun-linux-x64
            binary: hyperneo-linux-x64
            smoke: true
          - runner: ubuntu-latest
            target: bun-linux-arm64
            binary: hyperneo-linux-arm64
            smoke: false

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Install sandbox dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d/ \( -name "*microsoft*" -o -name "*azure*" \) -delete 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep

      - name: Install dependencies
        run: bun install

      - name: Build web frontend
        run: cd packages/web && bun run build

      - name: Generate embedded assets
        run: bun run scripts/generate-embedded-assets.ts

      - name: Compile binary
        run: bun build --compile --target=${{ matrix.target }} --outfile=dist/bin/${{ matrix.binary }} packages/cli/prod-entry.ts

      - name: Smoke test
        if: matrix.smoke
        run: bun run scripts/smoke-test.ts ./dist/bin/${{ matrix.binary }}
        env:
          GLM_API_KEY: smoke-test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: dist/bin/${{ matrix.binary }}

  # ============================================
  # DESKTOP RELEASE BUILD
  # Build, sign, and notarize macOS desktop artifacts; build unsigned Linux artifacts
  # ============================================

  desktop-release-build:
    name: Desktop Release ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: wait-for-ci
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            rust-target: aarch64-apple-darwin
            arch: darwin-arm64
          - runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            arch: darwin-x64
          - runner: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            arch: linux-x64

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Verify Apple signing secrets
        if: runner.os == 'macOS'
        run: |
          missing=0
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Configure App Store Connect API key
        if: runner.os == 'macOS'
        run: |
          KEY_DIR="$RUNNER_TEMP/appstoreconnect"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo find /etc/apt/sources.list.d/ \( -name "*microsoft*" -o -name "*azure*" \) -delete 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            rpm \
            wget

      - name: Install dependencies
        run: bun install

      - name: Setup Rust target
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: desktop-cargo-${{ runner.os }}-${{ matrix.rust-target }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            desktop-cargo-${{ runner.os }}-${{ matrix.rust-target }}-

      - name: Install Tauri CLI
        run: |
          if ! cargo tauri --version >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Build desktop app
        run: |
          cd packages/desktop
          bun run build:sidecar
          BUNDLES_FLAG=""
          if [ "${{ runner.os }}" = "Linux" ]; then
            BUNDLES_FLAG="--bundles deb,rpm"
          fi
          cargo tauri build --target ${{ matrix.rust-target }} $BUNDLES_FLAG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

      - name: Collect desktop artifacts
        run: |
          VERSION="${{ needs.wait-for-ci.outputs.version }}"
          ARTIFACT_DIR="$PWD/dist/desktop/${{ matrix.arch }}"
          BUNDLE_ROOT="$PWD/packages/desktop/src-tauri/target/${{ matrix.rust-target }}/release/bundle"
          mkdir -p "$ARTIFACT_DIR"

          find "$BUNDLE_ROOT" -maxdepth 4 -type f -print

          for dmg in "$BUNDLE_ROOT"/dmg/*.dmg; do
            [ -e "$dmg" ] || continue
            cp "$dmg" "$ARTIFACT_DIR/HyperNeo_${VERSION}_${{ matrix.arch }}.dmg"
          done

          for deb in "$BUNDLE_ROOT"/deb/*.deb; do
            [ -e "$deb" ] || continue
            cp "$deb" "$ARTIFACT_DIR/HyperNeo_${VERSION}_${{ matrix.arch }}.deb"
          done

          for rpm in "$BUNDLE_ROOT"/rpm/*.rpm; do
            [ -e "$rpm" ] || continue
            cp "$rpm" "$ARTIFACT_DIR/HyperNeo_${VERSION}_${{ matrix.arch }}.rpm"
          done

          if [ -d "$BUNDLE_ROOT/macos" ]; then
            APP_PATH=$(find "$BUNDLE_ROOT/macos" -maxdepth 1 -name '*.app' -type d -print -quit)
          else
            APP_PATH=""
          fi
          if [ -n "$APP_PATH" ]; then
            ditto -c -k --keepParent "$APP_PATH" "$ARTIFACT_DIR/HyperNeo_${VERSION}_${{ matrix.arch }}.app.zip"
          fi

          if ! compgen -G "$ARTIFACT_DIR/*" > /dev/null; then
            echo "::error::No desktop artifacts were produced"
            exit 1
          fi

          if command -v sha256sum >/dev/null 2>&1; then
            (cd "$ARTIFACT_DIR" && sha256sum * > "HyperNeo_${VERSION}_${{ matrix.arch }}_SHA256SUMS.txt")
          else
            (cd "$ARTIFACT_DIR" && shasum -a 256 * > "HyperNeo_${VERSION}_${{ matrix.arch }}_SHA256SUMS.txt")
          fi

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.arch }}
          path: dist/desktop/${{ matrix.arch }}/*

  # ============================================
  # PACKAGE
  # Create npm packages from built binaries
  # ============================================

  package:
    name: Package npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [wait-for-ci, release-build]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Download release binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: hyperneo-*
          path: dist/bin/

      - name: Move binaries to expected locations
        run: |
          mkdir -p dist/bin-flat
          for dir in dist/bin/hyperneo-*; do
            binary=$(basename "$dir")
            mv "$dir/$binary" "dist/bin-flat/$binary"
            chmod +x "dist/bin-flat/$binary"
          done
          rm -rf dist/bin
          mv dist/bin-flat dist/bin

      - name: Package npm packages
        run: bun run scripts/package-npm.ts --version ${{ needs.wait-for-ci.outputs.version }}

      - name: Upload npm packages
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: dist/npm/

  # ============================================
  # PUBLISH
  # Publish packages to npm registry
  # ============================================

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [wait-for-ci, package, desktop-release-build]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download npm packages
        uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: dist/npm/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for Trusted Publishing support
        run: npm install -g npm@latest

      - name: Publish platform packages
        run: |
          FAILED=0
          for pkg in dist/npm/cli-*; do
            PKG_NAME=$(basename "$pkg")
            echo "Publishing $PKG_NAME..."
            if OUTPUT=$(cd "$pkg" && npm publish --access public --provenance 2>&1); then
              echo "$OUTPUT"
              echo "$PKG_NAME published successfully"
            else
              echo "$OUTPUT"
              if echo "$OUTPUT" | grep -qiE "previously published|cannot publish over|EPUBLISHCONFLICT"; then
                echo "::warning::$PKG_NAME already published, skipping"
              else
                echo "::error::Failed to publish $PKG_NAME"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more platform packages failed to publish"
            exit 1
          fi

      - name: Publish main package
        run: |
          if OUTPUT=$(cd dist/npm/hyperneo && npm publish --access public --provenance 2>&1); then
            echo "$OUTPUT"
            echo "hyperneo published successfully"
          else
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qiE "previously published|cannot publish over|EPUBLISHCONFLICT"; then
              echo "::warning::hyperneo already published, skipping"
            else
              echo "::error::Failed to publish hyperneo"
              exit 1
            fi
          fi

  # ============================================
  # GITHUB RELEASE
  # Create a GitHub Release with auto-generated notes
  # ============================================

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [wait-for-ci, publish, desktop-release-build]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: dist/desktop/
          merge-multiple: true

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.wait-for-ci.outputs.version }}"
          echo "Creating GitHub Release for v$VERSION..."
          NOTES=$(sed -n "/^## \[${VERSION#v}\]/,/^## \[/p" CHANGELOG.md | sed '$d')
          echo "$NOTES" > /tmp/release-notes.md

          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find dist/desktop -type f | sort)

          if gh release view "v$VERSION" &>/dev/null; then
            echo "::warning::Release v$VERSION already exists, skipping creation"
            if [ ${#ASSETS[@]} -gt 0 ]; then
              echo "Uploading assets to existing release..."
              gh release upload "v$VERSION" "${ASSETS[@]}" --clobber
            fi
          else
            gh release create "v$VERSION" \
              "${ASSETS[@]}" \
              --title "v$VERSION" \
              --notes-file /tmp/release-notes.md
          fi
          echo "GitHub Release ready: v$VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
