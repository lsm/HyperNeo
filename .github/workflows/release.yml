name: Release candidate proof

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact commit to build and verify
        required: true
        type: string

permissions:
  contents: read
  statuses: write

jobs:
  macos-intel:
    name: Intel macOS fresh install
    runs-on: macos-15-intel
    timeout-minutes: 35

    steps:
      - name: Validate candidate
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: '[[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]'

      - name: Mark proof pending
        uses: actions/github-script@v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE,
              state: 'pending',
              context: 'release-proof/macos-intel',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          bun-version: 1.4.4

      - name: Build candidate
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          bash .claude/skills/verify/resource-check.sh
          bun install --frozen-lockfile
          bash .claude/skills/verify/resource-check.sh
          GITHUB_SHA="$CANDIDATE" bun scripts/build-binary.ts --target bun-darwin-x64
          printf 'candidate_build_exit=0\n'

      - name: Run compiled fresh install
        shell: bash
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          bash .claude/skills/verify/resource-check.sh
          PROOF_DIR="$(mktemp -d /private/tmp/hn-intel.XXXXXX)"
          trap 'bun -e "import {rmSync} from \"node:fs\"; rmSync(process.argv[1], {recursive: true})" "$PROOF_DIR"' EXIT
          mkdir "$PROOF_DIR/home"
          proof_exit=0
          env -i HOME="$PROOF_DIR/home" NODE_ENV=test HYPERNEO_DATA_DIR="$PROOF_DIR/data" \
            PATH="$(dirname "$(command -v bun)"):/usr/bin:/bin:/usr/sbin" \
            bun .claude/skills/verify/release-candidate.ts "$PWD/dist/bin/hyperneo-darwin-x64" "$PROOF_DIR" "$CANDIDATE" || proof_exit="$?"
          printf 'fresh_install_exit=%s\n' "$proof_exit"
          bun -e '
            const proof = await Bun.file(process.argv[1]).json();
            const steps = Object.entries(proof.steps).filter(([, result]) => result.pass);
            console.log(JSON.stringify({commit: proof.expectedCommit, count: steps.length, checks: steps.map(([name]) => name), stopped: proof.cleanup?.stopped}));
            if (!proof.passed || !proof.cleanup?.stopped) process.exit(1);
          ' "$PROOF_DIR/evidence/steps.json"
          exit "$proof_exit"

      - name: Verify standalone daemon
        shell: bash
        run: |
          bash .claude/skills/verify/resource-check.sh
          bun scripts/smoke-test.ts "$PWD/dist/bin/hyperneod-darwin-x64" --daemon
          printf 'standalone_daemon_smoke_exit=0\n'

      - name: Verify compiled numerical embeddings
        shell: bash
        run: |
          bash .claude/skills/verify/resource-check.sh
          PROOF_DIR="$(mktemp -d /private/tmp/hn-embed-intel.XXXXXX)"
          trap 'bun -e "import {rmSync} from \"node:fs\"; rmSync(process.argv[1], {recursive: true})" "$PROOF_DIR"' EXIT
          bun .claude/skills/verify/compiled-embedding-load.ts "$PROOF_DIR/proof" bun-darwin-x64
          printf 'compiled_embedding_load_exit=0\n'

      - name: Report candidate result
        if: always()
        uses: actions/github-script@v8
        env:
          CANDIDATE: ${{ inputs.candidate }}
          JOB_RESULT: ${{ job.status }}
        with:
          script: |
            if (!/^[0-9a-f]{40}$/.test(process.env.CANDIDATE)) return;
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: process.env.CANDIDATE,
              state: process.env.JOB_RESULT === 'success' ? 'success' : 'failure',
              context: 'release-proof/macos-intel',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
