name: Passive Window Capture
on:
  pull_request:
    branches: [dev]
    paths:
      - '.claude/skills/verify/window-capture/**'
      - '.github/workflows/passive-window-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: passive-window-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Passive capture fake-API tests
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path .claude/skills/verify/window-capture
